<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>İngilizce — Günlük Çalışma</title>
<meta name="theme-color" content="#f5f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16161a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="İngilizce">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f5f3ef; --card:#ffffff; --soft:#efece6; --ink:#1c1c1a; --mute:#75716a; --line:#e3dfd7;
  --acc:#e8590c; --acc2:#fff0e6; --accline:#f8c9ab; --ok:#2b7a4b; --ok2:#e6f3eb; --okline:#bfe0cc;
  --warn:#b42318; --warn2:#fdecea; --navbg:rgba(255,255,255,.94);
  --r:18px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#16161a; --card:#212126; --soft:#2a2a30; --ink:#f1efea; --mute:#a19d95; --line:#34343b;
    --acc:#ff7a33; --acc2:#3a2418; --accline:#6b3a1f; --ok:#5cc489; --ok2:#173326; --okline:#24543a;
    --warn:#ff8a7a; --warn2:#3a1d1a; --navbg:rgba(33,33,38,.94); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
main{max-width:620px;margin:0 auto;padding:calc(12px + var(--safe-t)) 16px calc(100px + var(--safe-b))}
h1{font-size:28px;letter-spacing:-.02em;margin:6px 0 2px;line-height:1.2}
h2{font-size:18px;margin:24px 0 10px;letter-spacing:-.01em}
h3{font-size:17px;margin:0 0 4px;line-height:1.3}
p{margin:6px 0}
a{color:var(--acc)}
.sub{color:var(--mute);font-size:14px}
.hint{font-size:13px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.sp{flex:1}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px 15px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;min-height:44px}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.acc{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px;min-height:36px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.link{background:transparent;border:0;color:var(--mute);font-weight:500;text-decoration:underline;padding:6px 0;min-height:0}
.btn:disabled{opacity:.4}
.full{width:100%}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--mute)}
.pill.ok{background:var(--ok2);color:var(--ok)}
.pill.acc{background:var(--acc2);color:var(--acc)}
/* Bugün */
.hero{display:flex;align-items:center;gap:16px}
.ring{--p:0;width:74px;height:74px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--ok) calc(var(--p)*1%), var(--soft) 0)}
.ring>div{width:58px;height:58px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:18px}
.week{display:flex;gap:6px;margin-top:14px}
.day{flex:1;text-align:center;font-size:11px;color:var(--mute)}
.dot{height:30px;margin-top:4px;border-radius:9px;background:var(--soft);display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff}
.dot.on{background:var(--ok)}
.dot.today{outline:2px solid var(--acc);outline-offset:1px}
.step{display:flex;gap:14px;align-items:flex-start;position:relative}
.step .num{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;background:var(--soft);color:var(--mute);font-size:15px}
.step.next{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
.step.next .num{background:var(--acc);color:#fff}
.step.done{background:var(--ok2);border-color:var(--okline)}
.step.done .num{background:var(--ok);color:#fff}
.step .body{flex:1;min-width:0}
.step .when{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.step.done .when{color:var(--ok)}
.step .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tick{appearance:none;border:2px solid var(--line);background:var(--card);border-radius:999px;font:inherit;font-size:13px;font-weight:700;color:var(--mute);padding:6px 12px;cursor:pointer;min-height:36px}
.tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
.auto{font-size:12.5px;color:var(--mute);margin-top:8px;display:flex;gap:6px;align-items:flex-start}
.steps{margin:8px 0 0;padding-left:20px;font-size:15px}
.steps li{margin:4px 0}
/* Nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--navbg);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:4px 6px calc(4px + var(--safe-b));display:flex;justify-content:center;z-index:10}
nav .in{display:flex;max-width:620px;width:100%}
nav button{flex:1;background:none;border:0;font:inherit;font-size:11.5px;color:var(--mute);padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;min-height:50px}
nav button .i{font-size:23px;line-height:1.15;filter:grayscale(1);opacity:.6}
nav button.on{color:var(--ink);font-weight:700}
nav button.on .i{filter:none;opacity:1}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px;margin:10px 0 4px;overflow-x:auto}
.tabs button{flex:1;border:0;background:none;font:inherit;font-size:14px;font-weight:600;padding:8px 10px;border-radius:9px;color:var(--mute);white-space:nowrap;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 6px}
.chips button{border:1px solid var(--line,rgba(0,0,0,.12));background:var(--card);font:inherit;font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px;color:var(--mute);cursor:pointer}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.lv{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--mute);margin-right:6px;vertical-align:1px;white-space:nowrap}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.back{margin:0 0 4px -8px}
/* Pratik merkezi */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{appearance:none;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:104px}
.tile .ti{font-size:28px;line-height:1.1;margin-bottom:4px}
.tile b{font-size:16px}
.tile span{font-size:13px;color:var(--mute);line-height:1.35}
input,textarea,select{font:inherit;width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--card);color:var(--ink)}
textarea{min-height:120px;resize:vertical}
label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:12px 0 4px}
/* Kart */
.flash{position:relative;text-align:center;padding:26px 18px;min-height:260px;display:flex;flex-direction:column;justify-content:center}
.flash .en{font-size:32px;font-weight:750;letter-spacing:-.01em;line-height:1.2}
.flash .stress{color:var(--acc);font-weight:700;letter-spacing:.04em;margin-top:4px}
.flash .tr{font-size:22px;font-weight:650;margin-top:6px}
.flash .ex{font-style:italic;margin-top:12px}
.codebox{background:var(--acc2);border:1px dashed var(--accline);border-radius:12px;padding:10px 12px;margin-top:14px;text-align:left}
.codebox b{color:var(--acc)}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.rate button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 4px;font:inherit;font-weight:700;cursor:pointer}
.rate button small{display:block;font-weight:500;color:var(--mute);font-size:12px}
.rate .r0{color:var(--warn)} .rate .r3{color:var(--ok)}
.progress{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.progress>div{height:100%;background:var(--acc);border-radius:99px}
.list .it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.list .it .t{flex:1;min-width:0}
.list .it .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.warn{background:var(--warn2);border-radius:12px;padding:10px 12px;font-size:15px}
.verbs{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.8}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:var(--soft);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--mute)}
.bar{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0}
.bar .lbl{width:110px;flex:none}
.bar .track{flex:1;height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar .track div{height:100%;background:var(--acc)}
.rec{width:84px;height:84px;border-radius:50%;border:0;background:var(--warn);color:#fff;font-size:30px;cursor:pointer;display:grid;place-items:center;margin:8px auto}
.rec.on{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(180,35,24,.45)}70%{box-shadow:0 0 0 18px rgba(180,35,24,0)}100%{box-shadow:0 0 0 0 rgba(180,35,24,0)}}
.big{font-size:40px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.talk{font-size:17px;line-height:1.65;background:var(--soft);border-radius:12px;padding:12px}
details summary{cursor:pointer;font-weight:700;list-style:none}
details summary::-webkit-details-marker{display:none}
.chev{float:right;color:var(--mute)}
details[open] .chev{transform:rotate(90deg)}
.story p{font-size:18px;line-height:1.75;margin:0 0 14px}
.story .w{cursor:pointer;border-radius:4px}
.story .w:active,.story .w:hover{background:var(--acc2);color:var(--acc)}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.gbody table{border-collapse:collapse;font-size:14px;width:100%}
.gbody td,.gbody th{border:1px solid var(--line);padding:5px 7px;text-align:left}
</style>
</head>
<body>
<main id="main"></main>
<nav><div class="in" id="nav"></div></nav>
<div class="toast" id="toast"></div>
<script src="data.js?v=5"></script>
<script src="data2.js?v=5"></script>
<script src="games.js?v=5"></script>
<script>
"use strict";
/* ================== YARDIMCILAR ================== */
const D = window.APP_DATA;
const KEY = "ingilizce_app_v1"; // v1/v2 ile aynı anahtar: eski ilerleme korunur
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const DAYS = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const DAYS_S = ["Pt","Sa","Ça","Pe","Cu","Ct","Pz"];
const MONTHS = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const fmtDate = s => { const d = parse(s); return d.getDate()+" "+MONTHS[d.getMonth()]+" "+DAYS[d.getDay()]; };
const ERR_TYPES = ["Geçmiş zaman","Article (a/an/the)","Edat (in/on/at...)","Fiil kalıbı","Kelime sırası","Kelime seçimi","Yazım","Telaffuz","Dinleme"];

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2600); }

async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); toast("Kopyalandı ✓ Şimdi yapay zekâya yapıştır"); return; }catch(e){}
  const ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast("Kopyalandı ✓"); }catch(e){ prompt("Kopyala:", txt); }
  ta.remove();
}

/* ================== DURUM (localStorage) ================== */
function defaultState(){
  return { v:1, deckVersion:0,
    settings:{ name:"Nihat", start:"2026-11-23", newPerDay:5, accent:"en-GB", rate:0.85, autoSpeak:true, minMode:false },
    cards:[], log:{}, grammar:{}, errors:[], writings:[], weekly:{}, efset:[], monthly:{},
    xp:0, badges:{}, games:{}, stories:{}, talkOverride:{}, profile:{onboarded:false} };
}
let S;
function load(){
  try{ S = JSON.parse(localStorage.getItem(KEY)) || defaultState(); }catch(e){ S = defaultState(); }
  const def = defaultState();
  for(const k in def) if(S[k]===undefined) S[k]=def[k];
  for(const k in def.settings) if(S.settings[k]===undefined) S.settings[k]=def.settings[k];
  if(!S.profile.onboarded && Object.keys(S.log).length) S.profile.onboarded = true;
  mergeDeck();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast("Kaydedilemedi! Depolama dolu olabilir."); } }
function mergeDeck(){
  if(S.deckVersion >= D.deckVersion) return;
  const have = new Set(S.cards.map(c=>c.id));
  D.DECK.forEach((r,i)=>{
    const id="d"+(i+1);
    if(have.has(id)) return;
    S.cards.push({id, order:i+1, en:r[0], tr:r[1], ex:r[2], code:"", hint:r[3]||"", stress:r[4]||"", mine:"", src:"deck",
      status:"new", due:null, ivl:0, ease:2.5, reps:0, lapses:0, introduced:null});
  });
  (D.PACKS||[]).forEach((pk,pi)=>pk.cards.forEach((r,i)=>{
    const id=pk.id+"_"+(i+1); if(have.has(id)) return;
    S.cards.push({id, order:(pi+1)*1000+i+1, en:r[0], tr:r[1], ex:r[2], code:"", hint:r[3]||"", stress:r[4]||"", mine:"", src:"deck",
      status:"new", due:null, ivl:0, ease:2.5, reps:0, lapses:0, introduced:null});
  }));
  S.deckVersion = D.deckVersion; save();
}
function dayLog(d=today()){
  if(!S.log[d]) S.log[d] = {cards:false, listen:false, evening:false, reviews:0, newDone:0};
  return S.log[d];
}
function isActive(d){ const l=S.log[d]; return !!(l && (l.cards||l.listen||l.evening||l.game||l.story||l.reviews)); }
function dayComplete(d){
  const l=S.log[d]; if(!l) return false;
  return S.settings.minMode ? l.cards : (l.cards && l.listen && l.evening);
}

/* ================== OTOMATİK İŞARETLEME ==================
   Uygulama içinde bir şey yaptığında (yazı kaydı, ses kaydı, hikâye, kart ekleme, değerlendirme)
   o günün görevine uyuyorsa görev kendiliğinden işaretlenir. */
const XP_FOR = {cards:10, listen:10, evening:15};
function markDone(field, quiet){
  const l = dayLog(); if(l[field]) return false;
  l[field] = true;
  const k = "xp_"+field; if(!l[k]){ l[k]=1; addXP(XP_FOR[field]||5); }
  save();
  if(!quiet){
    const names = {cards:"Kelime kartları", listen:"Dinleme", evening:"Günün görevi"};
    if(dayComplete(today())) setTimeout(()=>toast("🎉 Bugünün planı tamam! Harika iş."), 300);
    else toast("✓ "+names[field]+" tamamlandı");
  }
  return true;
}
function did(kind){
  const l = dayLog(); l["did_"+kind] = true; save();
  if(kind==="listen") return markDone("listen");
  const ev = eveningTask();
  if(ev.auto && ev.auto.includes(kind)) markDone("evening");
}
/* Dış link (podcast, ELLLO, video...) açıldığında: en az 2 dk sonra uygulamaya dönünce işaretle */
const EXT_SEC = 120;
function openExt(kind){ S._ext = {kind, t:Date.now(), day:today()}; save(); }
function checkExt(){
  const x = S._ext; if(!x) return false;
  if(x.day!==today()){ delete S._ext; save(); return false; }
  if((Date.now()-x.t)/1000 < EXT_SEC) return false;
  delete S._ext; save();
  did(x.kind==="listen" ? "listen" : "ext");
  return true;
}
function onReturn(){ if(document.visibilityState!=="hidden"){ dayRollover(); if(checkExt()) render(); } }
document.addEventListener("visibilitychange", onReturn);
window.addEventListener("focus", onReturn);
window.addEventListener("pageshow", onReturn);

/* ================== PROGRAM ================== */
function prog(d=today()){
  const n = diffDays(S.settings.start, d);
  if(n < 0) return {before:true, daysLeft:-n, week:0, month:0};
  const week = Math.floor(n/7)+1;
  const month = Math.min(6, Math.floor((week-1)/4)+1);
  return {before:false, week, month, dayN:n+1};
}
function topicForWeek(week){
  const w = Math.min(Math.max(week,1), 24);
  return D.GRAMMAR.find(g=>g.week===w) || D.GRAMMAR[D.GRAMMAR.length-1];
}
function talkForMonth(m){ return D.TALKS.find(t=>t.month===Math.max(1,Math.min(6,m))); }

/* Dinleme: seviyeye göre (linkler 23 Kasım 2026'da kontrol edildi) */
const L = {
  ellloA2:  ["ELLLO A2 dersleri","https://elllo.org/levels/A2-English-Lessons/index.html"],
  ellloB1:  ["ELLLO B1 dersleri","https://elllo.org/levels/B1-English-Lessons/index.html"],
  ellloBeg: ["ELLLO Beginner Podcast","https://podcasts.apple.com/podcast/id1813490486"],
  bcA2:     ["British Council A2 dinleme","https://learnenglish.britishcouncil.org/free-resources/listening/a2"],
  sixMin:   ["6 Minute English (Podcast)","https://podcasts.apple.com/podcast/id262026947"],
  bbcLE:    ["BBC Learning English","https://www.bbc.co.uk/learningenglish"],
  office:   ["BBC Office English","https://www.bbc.co.uk/learningenglish/english/features/office-english"],
  easy:     ["Easy English (video)","https://www.easyenglish.video/"]
};
/* Kaynak kütüphanesi (data.js RESOURCES). Seviye: A2, A2–B1, B1 */
function lvFor(month){ month=month||1; return month<=2?["A2","A2–B1"]:month<=4?["A2","A2–B1","B1"]:["A2–B1","B1"]; }
function pickRes(skills, n, avoid=[]){
  const p=prog(), lv=lvFor(p.month);
  const pool=D.RESOURCES.filter(g=>skills.includes(g.skill)).flatMap(g=>g.items).filter(i=>lv.includes(i.lv)&&!avoid.includes(i.url));
  return pool.length ? pool[((n%pool.length)+pool.length)%pool.length] : null;
}
function vRes(){
  if(!resF.lv) resF.lv = (prog().month||1)<=3 ? "A2" : "B1";
  const skills=[["all","Hepsi"],["pod","🎙️ Podcast"],["listen","🎧 Dinleme"],["video","📺 Video"],["read","📖 Okuma"],["speak","🗣️ Konuşma"],["write","✍️ Yazma"],["vocab","📚 Kelime & gramer"],["test","📏 Test & AI"]];
  const lvs=[["A2","A2 (şimdi)"],["B1","B1 (3. aydan)"],["all","Tüm seviyeler"]];
  const ok=i=>resF.lv==="all"||i.lv===resF.lv||i.lv==="A2–B1";
  const groups=D.RESOURCES.filter(g=>resF.skill==="all"||g.skill===resF.skill).map(g=>({...g,items:g.items.filter(ok)})).filter(g=>g.items.length);
  const n=groups.reduce((a,g)=>a+g.items.length,0);
  return `<h1>Kaynaklar</h1><p class="sub">Hepsi ücretsiz ve linkleri kontrol edildi. Beceri ve seviye seç; her gün birini dene, sıkılırsan başkasına geç.</p>
  <div class="chips">${skills.map(([k,t])=>`<button data-resk="${k}" class="${resF.skill===k?"on":""}">${t}</button>`).join("")}</div>

let voices=[];
function loadVoices(){ try{ voices = speechSynthesis.getVoices(); }catch(e){} }
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(text, rate){
  if(!("speechSynthesis" in window)){ toast("Bu tarayıcı sesli okumayı desteklemiyor"); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(text).replace(/–/g,", ").replace(/\.\.\./g," "));
  const acc = S.settings.accent;
  u.lang = acc; u.rate = rate || S.settings.rate;
  const v = voices.find(v=>v.lang===acc) || voices.find(v=>v.lang && v.lang.replace("_","-").startsWith(acc)) || voices.find(v=>v.lang && v.lang.startsWith("en"));
  if(v) u.voice = v;
  speechSynthesis.speak(u);
}

/* ================== SRS ================== */
function schedule(c, r){
  const t = today(); const x = Object.assign({}, c);
  if(r===0){ x.ease=Math.max(1.3,x.ease-0.2); if(x.status==="learning" && x.ivl>=1) x.lapses++; x.ivl=0; x.reps=0; x.due=t; x.status="learning"; return x; }
  if(r===1){ x.ivl = x.reps===0 ? 1 : Math.max(x.ivl+1, Math.round(x.ivl*1.2)); x.ease=Math.max(1.3,x.ease-0.15); }
  if(r===2){ x.ivl = x.reps===0 ? 1 : x.reps===1 ? 3 : Math.max(x.ivl+1, Math.round(x.ivl*x.ease)); }
  if(r===3){ x.ivl = x.reps===0 ? 3 : x.reps===1 ? 6 : Math.max(x.ivl+2, Math.round(x.ivl*x.ease*1.3)); x.ease+=0.15; }
  x.reps++; x.status="learning"; x.due=addDays(t, x.ivl);
  return x;
}
const ivlLabel = n => n===0 ? "şimdi" : n===1 ? "1 gün" : n<30 ? n+" gün" : Math.round(n/30)+" ay";
function cardLevel(c){ if(c.status==="new") return "new"; if(c.ivl>=21) return "known"; return "learning"; }
function dueCards(){ const t=today(); return S.cards.filter(c=>c.status!=="new" && c.due && c.due<=t).sort((a,b)=>a.due<b.due?-1:1); }
function newQueue(){
  return S.cards.filter(c=>c.status==="new").sort((a,b)=>{
    if(a.src!==b.src) return a.src==="user"?-1:1; return (a.order||0)-(b.order||0);
  });
}
function newAllowed(){ return Math.max(0, S.settings.newPerDay - dayLog().newDone); }
function cardsLeft(){ return dueCards().length + Math.min(newAllowed(), newQueue().length); }
let session = null; // {queue:[ids], shown:false, done:0, total:0}
function startSession(){
  const q = dueCards().map(c=>c.id).concat(newQueue().slice(0,newAllowed()).map(c=>c.id));
  session = {queue:q, shown:false, done:0, total:q.length};
  if(!q.length) markDone("cards");
}
function rate(r){
  if(!session || !session.queue.length) return;
  const id = session.queue.shift(); const c = S.cards.find(x=>x.id===id); if(!c) return;
  const l = dayLog();
  addXP(c.status==="new" ? 2 : 1);
  if(c.status==="new"){ c.introduced = today(); l.newDone++; }
  Object.assign(c, schedule(c, r));
  l.reviews++;
  if(r===0) session.queue.push(id); else session.done++;
  session.shown = false;
  if(!session.queue.length) markDone("cards", true);
  save(); render();
}

/* ================== KAYIT (IndexedDB) ================== */
const DB = { db:null,
  open(){ return new Promise((res,rej)=>{ if(this.db) return res(this.db); const r=indexedDB.open("ingilizce-rec",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("recs",{keyPath:"id"}); r.onsuccess=()=>{this.db=r.result;res(this.db)}; r.onerror=()=>rej(r.error); }); },
  async all(){ const db=await this.open(); return new Promise(res=>{ const out=[]; const tx=db.transaction("recs").objectStore("recs").openCursor();
    tx.onsuccess=e=>{ const c=e.target.result; if(c){ out.push(c.value); c.continue(); } else res(out.sort((a,b)=>b.ts-a.ts)); }; tx.onerror=()=>res([]); }); },
  async put(v){ const db=await this.open(); return new Promise(res=>{ const tx=db.transaction("recs","readwrite"); tx.objectStore("recs").put(v); tx.oncomplete=res; }); },
  async del(id){ const db=await this.open(); return new Promise(res=>{ const tx=db.transaction("recs","readwrite"); tx.objectStore("recs").delete(id); tx.oncomplete=res; }); }
};
let rec = {mr:null, chunks:[], start:0, timer:null, lastBlob:null, lastMime:""};
async function toggleRec(){
  if(rec.mr && rec.mr.state==="recording"){ rec.mr.stop(); return; }
  if(!navigator.mediaDevices || !window.MediaRecorder){ toast("Bu tarayıcıda ses kaydı desteklenmiyor"); return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const mime = ["audio/mp4","audio/webm;codecs=opus","audio/webm",""].find(m=>!m || MediaRecorder.isTypeSupported(m));
    rec.mr = mime ? new MediaRecorder(stream,{mimeType:mime}) : new MediaRecorder(stream);
    rec.chunks=[]; rec.start=Date.now();
    rec.mr.ondataavailable = e => { if(e.data.size) rec.chunks.push(e.data); };
    rec.mr.onstop = () => { stream.getTracks().forEach(t=>t.stop()); clearInterval(rec.timer);
      rec.lastMime = rec.mr.mimeType || "audio/mp4"; rec.lastBlob = new Blob(rec.chunks,{type:rec.lastMime}); rec.dur=Math.round((Date.now()-rec.start)/1000); render(); };
    rec.mr.start(); rec.timer=setInterval(()=>{ const el=$("#recTime"); if(el) el.textContent=fmtSec(Math.round((Date.now()-rec.start)/1000)); },500);
    render();
  }catch(e){ toast("Mikrofon izni verilmedi"); }
}
const fmtSec = s => Math.floor(s/60)+":"+pad(s%60);
async function saveRec(){
  if(!rec.lastBlob) return;
  const label = ($("#recLabel")?.value || "").trim() || ("Kayıt "+fmtDate(today()));
  await DB.put({id:uid(), ts:Date.now(), date:today(), label, blob:rec.lastBlob, mime:rec.lastMime, dur:rec.dur||0});
  rec.lastBlob=null; award("first_rec"); addXP(10); toast("Kayıt saklandı ✓"); did("record"); render();
}

function cardList(){
  const lv = {all:"Hepsi", learning:"Öğreniyorum", known:"Oturdu", new:"Sırada"};
  let list = S.cards.slice();
  if(cardFilter!=="all") list = list.filter(c=>cardLevel(c)===cardFilter);
  else list = list.filter(c=>c.status!=="new" || c.src==="user"); // "Hepsi": öğrenmeye başladıkların (sıradakiler ayrı sekmede)
  if(cardSearch) { const q=cardSearch.toLowerCase(); list=S.cards.filter(c=>(c.en+" "+c.tr).toLowerCase().includes(q)); }
  list.sort((a,b)=> (a.src===b.src ? (a.order||0)-(b.order||0) : (a.src==="user"?-1:1)));
  const cnt = k => k==="all"?S.cards.filter(c=>c.status!=="new"||c.src==="user").length:S.cards.filter(c=>cardLevel(c)===k).length;
  return `<h2>Kartlarım</h2>
  <div class="tabs">${Object.entries(lv).map(([k,t])=>`<button data-filter="${k}" class="${cardFilter===k?"on":""}">${t} (${cnt(k)})</button>`).join("")}</div>
  <input id="cardSearch" placeholder="Ara (İngilizce ya da Türkçe)" value="${esc(cardSearch)}" style="margin:6px 0">
  ${cardFilter==="new"&&!cardSearch?`<p class="hint">Bunlar sıradaki kelimeler. Her gün sırayla ${S.settings.newPerDay} tanesi gelir: önce 1. ayın temel kelimeleri, sonra 2. ay ürün-malzeme, sonra 3–4. ay iş dili.</p>`:""}

    <button class="btn sm ghost" data-say="${esc(c.en)}" aria-label="Dinle">🔊</button>

    <span class="pill ${cardLevel(c)==="known"?"ok":cardLevel(c)==="learning"?"acc":""}">${lv[cardLevel(c)]}</span>
    <button class="btn sm ghost" data-edit="${c.id}" aria-label="Düzenle">✎</button></div>`).join("") || `<p class="sub">${cardFilter==="all"?"Henüz kart çalışmadın. Yukarıdan ▶ Başla.":"Kart yok."}</p>`}</div>`;

    <audio controls src="${URL.createObjectURL(r.blob)}" style="width:100%"></audio></div>`).join("") : `<p class="sub">Henüz kayıt yok. İlk kaydın: '1. gün'.</p>`;
}
let timerLeft=0, timerInt=null;
function startTimer(min){
  clearInterval(timerInt); timerLeft=min*60;
  const out=()=>{ const el=$("#timerOut"); if(el) el.textContent=fmtSec(Math.max(0,timerLeft)); };
  out(); if(!min) return;
  timerInt=setInterval(()=>{ timerLeft--; out(); if(timerLeft<=0){ clearInterval(timerInt); toast("⏰ Süre bitti!"); try{ navigator.vibrate&&navigator.vibrate(400);}catch(e){} } },1000);
}
function vErrors(){
  const counts = {}; S.errors.forEach(e=>counts[e.type]=(counts[e.type]||0)+1);
  const max = Math.max(1,...Object.values(counts));
  const top = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
  return `<div class="card"><h3>Yeni hata ekle</h3>
    <label>Yanlış</label><input id="e_wrong" placeholder="ör. I was maked a car">
    <label>Doğru</label><input id="e_right" placeholder="ör. I made a car">
    <label>Neden (kısa)</label><input id="e_why" placeholder="ör. make düzensiz fiil, geçmişi made">
    <label>Tür</label><select id="e_type">${ERR_TYPES.map(t=>`<option>${t}</option>`).join("")}</select>
    <div class="row" style="margin-top:12px"><button class="btn acc" data-act="adderr">Ekle</button><label style="margin:0;display:flex;gap:6px;align-items:center;font-weight:500"><input type="checkbox" id="e_card" checked style="width:auto"> Kart da yap</label></div></div>
  ${top?`<div class="card"><h3>En sık hatan: ${esc(top[0])}</h3><p class="sub">Bir sonraki ayın odak konusu bu olsun.</p>
    ${Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="bar"><span class="lbl">${esc(k)}</span><div class="track"><div style="width:${100*v/max}%"></div></div><b>${v}</b></div>`).join("")}</div>`:""}
  <h2>Defter (${S.errors.length})</h2>
  <div class="card list">${S.errors.slice().reverse().map(e=>`<div class="it"><div class="t"><span class="sub">${fmtDate(e.date)} · ${esc(e.type)}</span>
    <div>❌ <s>${esc(e.wrong)}</s></div><div>✅ <b style="display:inline">${esc(e.right)}</b></div>${e.why?`<div class="hint">${esc(e.why)}</div>`:""}</div>
    <button class="btn sm ghost" style="color:var(--warn)" data-delerr="${e.id}">Sil</button></div>`).join("") || `<p class="sub">Henüz hata yok. Yazılarından sonra hatalarını buraya ekle.</p>`}</div>`;
}

/* ---------- İLERLEME (BEN) ---------- */
function vMe(){
  const tabs = `<h1>İlerleme</h1><div class="tabs"><button data-sub="me:progress" class="${sub.me==="progress"?"on":""}">📈 Durumum</button><button data-sub="me:settings" class="${sub.me==="settings"?"on":""}">⚙️ Ayarlar</button><button data-sub="me:install" class="${sub.me==="install"?"on":""}">📲 Kurulum</button></div>`;
  if(sub.me==="settings") return tabs + vSettings();
  if(sub.me==="install") return tabs + vInstall();
  const days = Object.keys(S.log).filter(isActive).length;
  const lv = k => S.cards.filter(c=>cardLevel(c)===k).length;
  const reviews = Object.values(S.log).reduce((a,l)=>a+(l.reviews||0),0);
  const p = prog(); const wkKey = p.before ? "0" : String(p.week); const w = S.weekly[wkKey] || {};
  const act = weekCount();
  return tabs + `
  <div class="card stat"><div><b>${days}</b><span>çalışılan gün</span></div><div><b>${lv("learning")+lv("known")}</b><span>öğrenilen kelime</span></div><div><b>${lv("known")}</b><span>oturmuş kelime</span></div>
  <div><b>${streak()}</b><span>gün seri</span></div><div><b>${S.writings.length}</b><span>yazı</span></div><div><b>${S.errors.length}</b><span>kayıtlı hata</span></div></div>
  <div class="card" id="weeklyBox"><h3>🗓️ Haftalık değerlendirme ${p.before?"":`(${p.week}. hafta)`}</h3>
    <p class="sub">Bu hafta ${act}/7 gün çalıştın. Pazar günü doldur.</p>
    <label>Bu hafta en çok neyi zorlandım / en sık hatam ne?</label><input id="wk1" value="${esc(w.q1||"")}">
    <label>Bu hafta neyi iyi yaptım?</label><input id="wk2" value="${esc(w.q2||"")}">
    <label>Gelecek hafta neyi farklı yapacağım?</label><input id="wk3" value="${esc(w.q3||"")}">
    <button class="btn acc" style="margin-top:12px" data-act="saveweekly" data-wk="${wkKey}">✓ Kaydet</button></div>
  <div class="card"><h3>📏 Seviye testleri (EF SET)</h3><p class="hint">Bu, gerçek İngilizce seviyen (A2, B1…). Plan: 1. hafta, 3. ay ve 6. ay.</p>
    <div class="row wrap"><input id="ef_level" placeholder="Seviye (ör. A2)" style="flex:1;min-width:110px"><input id="ef_score" placeholder="Puan (ör. 38)" style="flex:1;min-width:110px"><button class="btn pri" data-act="addef">Ekle</button></div>
    <a class="btn sm" style="margin-top:8px" href="https://www.efset.org/" target="_blank" rel="noopener">EF SET'i aç ↗</a>
    <div class="list" style="margin-top:8px">${S.efset.map(e=>`<div class="it"><div class="t"><b>${esc(e.level)} ${e.score?"· "+esc(e.score):""}</b><span class="sub">${fmtDate(e.date)}</span></div></div>`).join("")}</div></div>
  ${xpBar()}${badgesView()}
  <div class="card"><h3>Son haftalar</h3>${Object.entries(S.weekly).sort((a,b)=>b[0]-a[0]).slice(0,8).map(([k,v])=>`<p><b>${k}. hafta:</b> <span class="sub">${esc(v.q1||"")}${v.q3?" → "+esc(v.q3):""}</span></p>`).join("") || `<p class="hint">Pazar günleri doldur.</p>`}</div>
  <div class="card"><h3>💌 Arkadaşına öner</h3><p class="sub">Uygulamanın linkini kopyalar. Arkadaşının verileri kendi telefonunda ayrı tutulur.</p><button class="btn sm" data-g="share">📋 Davet mesajını kopyala</button></div>`;
}
function vSettings(){
  const s=S.settings;
  return `<div class="card">
    <label>Adın</label><input id="s_name" value="${esc(s.name)}">
    <label>Program başlangıç tarihi</label><input id="s_start" type="date" value="${esc(s.start)}">
    <label>Günlük yeni kelime sayısı</label><input id="s_new" type="number" min="1" max="30" value="${s.newPerDay}">
    <p class="hint">5 ile başla. Sabah tekrarları 15 dakikayı geçerse azalt, çok kolay geliyorsa 8'e çık.</p>
    <label>Aksan</label><select id="s_acc"><option value="en-GB" ${s.accent==="en-GB"?"selected":""}>İngiliz (en-GB)</option><option value="en-US" ${s.accent==="en-US"?"selected":""}>Amerikan (en-US)</option></select>
    <label>Okuma hızı: <span id="rateV">${s.rate}</span></label><input id="s_rate" type="range" min="0.5" max="1.2" step="0.05" value="${s.rate}">
    <label style="display:flex;gap:8px;align-items:center;font-weight:500;color:var(--ink)"><input type="checkbox" id="s_auto" ${s.autoSpeak?"checked":""} style="width:auto"> Kart açılınca otomatik seslendir</label>
    <div class="row" style="margin-top:12px"><button class="btn acc" data-act="savesettings">Kaydet</button><button class="btn" data-say="Hello, this is a test.">🔊 Sesi dene</button></div>
  </div>
  <div class="card"><h3>💾 Yedek</h3><p class="sub">Tüm verilerin bu telefonda saklanıyor. Haftada bir yedek al ve iCloud Drive'a ya da e-postana kaydet.</p>
    <div class="row wrap" style="margin-top:8px"><button class="btn pri" data-act="export">⬇ Yedek al</button><label class="btn" style="margin:0;color:var(--ink);font-size:15px">⬆ Yedekten yükle<input type="file" id="importFile" accept=".json,application/json" style="display:none"></label></div>
    <p class="hint">Son yedek: ${S._lastBackup?fmtDate(S._lastBackup):"hiç alınmadı"}</p></div>
  <div class="card"><h3 style="color:var(--warn)">Sıfırla</h3><p class="sub">Her şeyi siler. Önce yedek al.</p><button class="btn" style="color:var(--warn)" data-act="resetall">Tüm verileri sil</button></div>
  <p class="hint" style="text-align:center">Sürüm 3</p>`;
}
function vInstall(){
  const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  return `<div class="card">${standalone?`<p style="color:var(--ok);font-weight:700">✓ Uygulama ana ekrana kurulu. İnternetsiz de açılır.</p>`:`<p><b>Ana ekrana ekle</b>, böylece normal bir uygulama gibi açılır ve internet olmadan da çalışır.</p>`}</div>
  <div class="card"><h3>📱 iPhone (Safari)</h3><ol class="steps"><li>Bu sayfayı <b>Safari</b>'de aç.</li><li>Alttaki <b>Paylaş</b> butonuna (kare ve ok) bas.</li><li><b>Ana Ekrana Ekle</b>'yi seç → Ekle.</li></ol></div>
  <div class="card"><h3>🤖 Android (Chrome)</h3><ol class="steps"><li>Bu sayfayı <b>Chrome</b>'da aç.</li><li>Sağ üstteki <b>⋮</b> menüsüne bas.</li><li><b>Ana ekrana ekle</b> ya da <b>Uygulamayı yükle</b>'yi seç.</li></ol>
  ${deferredPrompt?`<button class="btn acc" data-act="install">📲 Şimdi yükle</button>`:""}</div>
  <div class="card"><h3>Bilmen gerekenler</h3><ul class="steps"><li>Podcast linkleri iPhone'da <b>Podcasts</b> uygulamasında açılır. Dinleyip 2 dk'dan sonra uygulamaya dönünce dinleme kendiliğinden işaretlenir.</li><li>Verilerin sadece bu telefonda. <b>Haftada bir yedek al</b> (Ayarlar → Yedek al).</li><li>Sesli okuma telefonunun kendi İngilizce sesini kullanır. Ses kötüyse Ayarlar → Erişilebilirlik → Seslendirilen İçerik → Sesler'den İngilizce "Gelişmiş" bir ses indirebilirsin.</li></ul></div>`;
}

/* ================== OLAYLAR ================== */
document.addEventListener("click", async e=>{
  const b = e.target.closest("button, a, label"); if(!b) return;
  const d = b.dataset;
  if(d.ext){ openExt(d.ext); return; } // link normal açılır
  if(d.nav){ G=null; ST=null; view=d.nav; editCardId=null; if(view==="practice") sub.practice="home"; if(view!=="cards") session=null; openTopic=null; talkM=null; render(); window.scrollTo(0,0); return; }
  if(d.go){ go(d.go); return; }
  if(d.sub){ const [a,v]=d.sub.split(":"); sub[a]=v; render(); return; }
  if(d.say!==undefined){ speak(d.say); return; }
  if(d.sayslow!==undefined){ speak(d.sayslow, Math.max(0.5,S.settings.rate-0.25)); return; }
  if(d.tick){ const l=dayLog(); if(l[d.tick]){ l[d.tick]=false; save(); render(); } else { markDone(d.tick); render(); } return; }
  if(d.rate!==undefined){ rate(+d.rate); window.scrollTo(0,0); return; }
  if(d.filter){ cardFilter=d.filter; render(); return; }
  if(d.resk){ resF.skill=d.resk; render(); return; }
  if(d.resl){ resF.lv=d.resl; render(); return; }
  if(d.edit){ editCardId=d.edit; render(); window.scrollTo(0,0); return; }
  if(d.gstat){ const before=S.grammar[d.gstat]||0; S.grammar[d.gstat]=(before+1)%4; openTopic=d.gstat; save(); render(); return; }
  if(d.timer!==undefined){ startTimer(+d.timer); return; }
  if(d.delrec){ if(confirm("Bu kaydı silmek istiyor musun?")){ await DB.del(d.delrec); fillRecs(); } return; }
  if(d.delerr){ S.errors=S.errors.filter(x=>x.id!==d.delerr); save(); render(); return; }
  if(d.delwrite){ if(confirm("Bu yazıyı silmek istiyor musun?")){ S.writings=S.writings.filter(x=>x.id!==d.delwrite); save(); render(); } return; }
  if(d.copy==="speak"){ copyText(speakPrompt()); return; }
  if(d.copy==="code"){ const c=S.cards.find(x=>x.id===d.id); copyText(codePrompt(c.en,c.tr)); return; }
  switch(d.act){
    case "show": session.shown=true; render(); break;
    case "endsession": session=null; render(); break;
    case "minon": S.settings.minMode=true; S._minDay=today(); save(); render(); toast("Bugün sadece kartlar. Yarın normal devam!"); break;
    case "minoff": S.settings.minMode=false; save(); render(); break;
    case "newcard": editCardId="new"; render(); window.scrollTo(0,0); break;
    case "canceledit": editCardId=null; render(); break;
    case "savecode": { const c=S.cards.find(x=>x.id===d.id); c.code=$("#codeIn").value.trim(); c.mine=$("#mineIn").value.trim(); save(); if(session) session.shown=true; render(); toast("Kaydedildi ✓"); break; }
    case "savecard": {
      const en=$("#f_en").value.trim(), tr=$("#f_tr").value.trim(); if(!en||!tr){ toast("İngilizce ve Türkçe alanları gerekli"); return; }
      const f={en,tr,ex:$("#f_ex").value.trim(),code:$("#f_code").value.trim(),mine:$("#f_mine").value.trim(),stress:$("#f_stress").value.trim()};
      const isNew = editCardId==="new";
      if(isNew) S.cards.push(Object.assign({id:"u"+uid(),order:Date.now(),src:"user",hint:"",status:"new",due:null,ivl:0,ease:2.5,reps:0,lapses:0,introduced:null},f));
      else Object.assign(S.cards.find(x=>x.id===editCardId),f);
      save(); editCardId=null; toast("Kart kaydedildi ✓"); if(isNew) did("card"); render(); break; }
    case "delcard": if(confirm("Kartı silmek istiyor musun?")){ S.cards=S.cards.filter(x=>x.id!==editCardId); editCardId=null; save(); render(); } break;
    case "resetcard": Object.assign(S.cards.find(x=>x.id===editCardId),{status:"new",due:null,ivl:0,ease:2.5,reps:0}); save(); toast("Kart yeniden öğrenilecek"); break;
    case "copycorr": { const txt=$("#w_text").value.trim(); if(!txt){ toast("Önce bir şeyler yaz"); return; } copyText(correctionPrompt(txt, d.focus)); break; }
    case "savewrite": { const txt=$("#w_text").value.trim(); if(!txt){ toast("Metin boş"); return; }
      S.writings.push({id:uid(),date:today(),prompt:$("#w_prompt").value,text:txt,corrected:($("#w_corr")?.value||"").trim()}); S._draft="";
      addXP(15); save(); toast("Yazı kaydedildi ✓"); did("write"); writeCtx=null; render(); break; }
    case "adderr": { const w=$("#e_wrong").value.trim(), r=$("#e_right").value.trim(); if(!w||!r){ toast("Yanlış ve doğru alanları gerekli"); return; }
      const why=$("#e_why").value.trim(), type=$("#e_type").value;
      S.errors.push({id:uid(),date:today(),wrong:w,right:r,why,type});
      if($("#e_card").checked) S.cards.push({id:"u"+uid(),order:Date.now(),src:"user",en:r,tr:"✅ doğrusu · ❌ "+w,ex:why,code:"",hint:"",mine:"",stress:"",status:"new",due:null,ivl:0,ease:2.5,reps:0,lapses:0,introduced:null});
      addXP(3); save(); toast("Deftere eklendi ✓"); render(); break; }
    case "rec": toggleRec(); break;
    case "saverec": await saveRec(); break;
    case "discardrec": rec.lastBlob=null; render(); break;
    case "stopsay": try{ speechSynthesis.cancel(); }catch(e){} break;
    case "saveweekly": { S.weekly[d.wk]={q1:$("#wk1").value.trim(),q2:$("#wk2").value.trim(),q3:$("#wk3").value.trim(),date:today()};
      addXP(5); save(); toast("Kaydedildi ✓"); did("weekly"); render(); break; }
    case "addef": { const lv=$("#ef_level").value.trim(); if(!lv){ toast("Seviyeyi yaz"); return; } S.efset.push({date:today(),level:lv,score:$("#ef_score").value.trim()}); addXP(20); save(); render(); break; }
    case "savesettings": { const s=S.settings; s.name=$("#s_name").value.trim()||"Nihat"; s.start=$("#s_start").value||s.start;
      s.newPerDay=Math.max(1,Math.min(30,+$("#s_new").value||5)); s.accent=$("#s_acc").value; s.rate=+$("#s_rate").value; s.autoSpeak=$("#s_auto").checked; save(); toast("Ayarlar kaydedildi ✓"); render(); break; }
    case "export": { S._lastBackup=today(); save(); const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="ingilizce-yedek-"+today()+".json"; document.body.appendChild(a); a.click(); a.remove(); toast("Yedek indirildi ✓"); render(); break; }
    case "resetall": if(confirm("Tüm veriler silinecek. Emin misin?") && confirm("Gerçekten emin misin? Geri alınamaz.")){ localStorage.removeItem(KEY); load(); render(); } break;
    case "install": if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt=null; } break;
  }
});
document.addEventListener("input", e=>{
  if(e.target.id==="cardSearch"){ cardSearch=e.target.value; const pos=e.target.selectionStart; render(); const el=$("#cardSearch"); el.focus(); el.setSelectionRange(pos,pos); }
  if(e.target.id==="w_text"){ S._draft=e.target.value; $("#w_count").textContent=wc(e.target.value)+" kelime"; clearTimeout(save._t); save._t=setTimeout(save,600); }
  if(e.target.id==="s_rate"){ $("#rateV").textContent=e.target.value; }
});
document.addEventListener("change", e=>{
  if(e.target.id==="talkMonth"){ talkM=+e.target.value; TE=false; render(); }
  if(e.target.id==="importFile"){ const f=e.target.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{ const data=JSON.parse(r.result); if(!data.cards||!data.settings) throw 0; if(confirm("Yedek yüklenecek, şu anki veriler değişecek. Devam?")){ localStorage.setItem(KEY, JSON.stringify(data)); load(); toast("Yedek yüklendi ✓"); render(); } }catch(err){ toast("Bu dosya geçerli bir yedek değil"); } };
    r.readAsText(f); }
});

/* ================== GÜN DEĞİŞİMİ ================== */
let curDay = null;
function dayRollover(){
  const t = today(); if(curDay===t) return;
  const first = curDay===null; curDay = t;
  if(S._minDay!==t && S.settings.minMode){ S.settings.minMode=false; }
  if(S._ext && S._ext.day!==t) delete S._ext;
  save(); if(!first){ session=null; render(); }
}
setInterval(dayRollover, 60000);

/* ================== KURULUM (PWA) ================== */
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); deferredPrompt=e; });
if("serviceWorker" in navigator && location.protocol==="https:"){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{ try{ r.update(); }catch(e){} }).catch(()=>{}); });
  let reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{ if(reloaded) return; reloaded=true; location.reload(); });
}
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
load(); dayRollover(); checkExt();
render();
</script>
